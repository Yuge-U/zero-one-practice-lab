name: ZERO ONE PRACTICE production release # このアプリだけを検証して公開します。
on: # 修正ブランチでは検証だけ行います。
  push: # コード変更を検証します。
    branches: [main, release/practice-1-0, fix/onedrive-fetch-101] # 本番以外からは配信しません。
    paths: ['production/**', 'release-lock.json', 'THIRD_PARTY_NOTICES.md', 'tools/**', '.github/workflows/deploy-pages.yml'] # 公開関連の変更だけを対象にします。
  workflow_dispatch: # 本人による再実行を許可します。
permissions: # 既定は読取のみです。
  contents: read # 本人OneDriveへは接続しません。
concurrency: # 同じブランチの処理を順番にします。
  group: practice-production-${{ github.ref }} # 本番と修正を分離します。
  cancel-in-progress: false # 公開途中で中断しません。
jobs: # ビルドと配信を分けます。
  build: # 両OSで同じ公開バイトを検証します。
    if: github.repository == 'Yuge-U/zero-one-practice-lab' # 対象をこのアプリに限定します。
    strategy: # 全環境の結果を残します。
      fail-fast: false # 他方のエラーで打ち切りません。
      matrix: # 実機iPhoneではありません。
        os: [ubuntu-24.04, macos-15] # 既存の検証環境を維持します。
    runs-on: ${{ matrix.os }} # OS別に確認します。
    timeout-minutes: 15 # 無期限に実行しません。
    steps: # 既存の保存・コピー試験も残します。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 固定したソース取得処理です。
        with: # 認証情報を残しません。
          persist-credentials: false # 作業用の認証設定を保存しません。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 旧版を読取専用で取得します。
        with: # 可変ブランチへ追随しません。
          repository: Yuge-U/basketball-tactics-board # 元アプリへ書き込みません。
          ref: b9390aa320ec39a19f649849a1111e26e4968453 # 検証した基準を固定します。
          path: upstream # 作業コピーを分離します。
          persist-credentials: false # 認証を残しません。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # 同じ実行環境を用意します。
        with: # 旧試験と合わせます。
          node-version: '22.16.0' # 実行版を固定します。
      - name: Verify baseline and prepare production candidate # 全公開ファイルを照合します。
        env: # 読取用の短期認証です。
          GH_TOKEN: ${{ github.token }} # Microsoftの資格情報ではありません。
          IMAGE_PYTHON: ${{ github.workspace }}/.image-env/bin/python # アイコン変換用です。
        run: | # 既存のビルドと画像を維持します。
          python3 -m venv .image-env # OS本体から変換環境を分離します。
          .image-env/bin/python -m pip install --only-binary=:all: pillow==12.3.0 # 元と同じ変換版です。
          node tools/build-release.mjs # 0.3.2の検査値を確認します。
          node production/prepare.mjs # 1.0.1の限定差分を適用します。
      - name: Install pinned browsers # 両エンジンを準備します。
        working-directory: upstream/practice-ui-lab/app # 公開領域とは分離します。
        run: | # 固定したツールを使います。
          npm install --no-save --ignore-scripts playwright@1.63.0 # ライフサイクルは実行しません。
          npx playwright install --with-deps chromium webkit # WebKitも省略しません。
      - name: Check native network receiver and cloud-open flow # 模擬fetchでは見逃した不具合を再現します。
        working-directory: upstream/practice-ui-lab/app # 配信するコード自体を検証します。
        run: | # 本人認証や実クラウドは使いません。
          node --test tests/production.test.mjs tests/network.test.mjs # 原本保護と新しい通信境界を確認します。
          node tools/network-browser.mjs # 旧版の通信前失敗と修正版のHTTP到達を比較します。
      - name: Check existing UI and data upgrade # 元の受入条件を残します。
        working-directory: upstream/practice-ui-lab/app # 同じ公開候補を操作します。
        run: | # 両方が成功しなければ公開しません。
          node tools/browser-project.mjs # 既存11シナリオを実行します。
          node tools/production-browser.mjs # 保存・コピーと旧データ保持を確認します。
      - name: Preserve evidence # 失敗も保存します。
        if: always() # 途中失敗の証拠を残します。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 固定した公式アクションです。
        with: # 合成データだけの成果物です。
          name: practice-production-${{ matrix.os }} # OS別に保管します。
          path: | # 公開コードと試験結果だけです。
            reports/
            upstream/practice-ui-lab/app/reports/
            upstream/practice-ui-lab/app/web/
            upstream/practice-ui-lab/app/tools/
          retention-days: 14 # 検証ログを保持します。
      - name: Package tested public site # 本番コミットだけを梱包します。
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-24.04' # 修正ブランチでは公開しません。
        uses: actions/upload-pages-artifact@v4 # Pages用の公式形式です。
        with: # ログとDBを含めません。
          path: _site # 検証済み静的ファイルだけです。
  deploy: # 全事前検証が成功してから配信します。
    needs: build # 両OSの成功を要求します。
    if: github.ref == 'refs/heads/main' # 本番更新だけを許可します。
    runs-on: ubuntu-24.04 # 既存の配信先を維持します。
    timeout-minutes: 10 # 配信待ちを制限します。
    permissions: # このジョブだけ配信権限を持ちます。
      pages: write # このアプリのPagesを更新します。
      id-token: write # GitHubの短期認証を使います。
    environment: # 公開環境は変えません。
      name: github-pages # 既定環境を維持します。
      url: ${{ steps.deployment.outputs.page_url }} # 実際の配信URLを記録します。
    outputs: # 公開後確認へ渡します。
      page_url: ${{ steps.deployment.outputs.page_url }} # 配信結果のURLを使用します。
    steps: # 検証済み成果物だけを配信します。
      - name: Publish production app # 既存アプリやOneDriveには変更しません。
        id: deployment # 配信結果の参照名です。
        uses: actions/deploy-pages@v4 # 公式の配信処理を使います。
  verify-live: # 公開後の実URLを別途確認します。
    needs: deploy # 配信完了後に開始します。
    runs-on: ubuntu-24.04 # 合成プロファイルだけを使用します。
    timeout-minutes: 15 # 検証待ちに上限を設けます。
    steps: # 同じコードと実行環境を再現します。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # このリリースを取得します。
        with: # 認証は保存しません。
          persist-credentials: false # 公開ソースの読取です。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 基準ソースを読みます。
        with: # 元の公開先は触りません。
          repository: Yuge-U/basketball-tactics-board # 元アプリは読取のみです。
          ref: b9390aa320ec39a19f649849a1111e26e4968453 # 版を固定します。
          path: upstream # 検証用コピーです。
          persist-credentials: false # 認証を残しません。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # 固定した実行環境です。
        with: # 事前検証と合わせます。
          node-version: '22.16.0' # 同じ版で確認します。
      - name: Prepare verification # 本人データを取得せず検証を準備します。
        env: # 公開コード読取用です。
          GH_TOKEN: ${{ github.token }} # 本人Microsoftトークンは使いません。
          IMAGE_PYTHON: ${{ github.workspace }}/.image-env/bin/python # 同じ画像変換環境です。
        run: | # 公開バイトを再現します。
          python3 -m venv .image-env # 検証環境を分離します。
          .image-env/bin/python -m pip install --only-binary=:all: pillow==12.3.0 # 固定変換条件です。
          node tools/build-release.mjs # 基準を照合します。
          node production/prepare.mjs # 新版のバイトを再現します。
          cd upstream/practice-ui-lab/app # 検証コードへ移動します。
          npm install --no-save --ignore-scripts playwright@1.63.0 # 固定ランナーを使用します。
          npx playwright install --with-deps chromium webkit # 両エンジンを用意します。
      - name: Verify public HTTPS bytes # 公開後の全バイトを照合します。
        env: # 配信結果のURLを使います。
          SITE_URL: ${{ needs.deploy.outputs.page_url }} # 別サイトを検査しません。
        run: node production/check-public.mjs # 配信中の修正版を確認します。
      - name: Save and copy on public HTTPS # 本人領域へは接続しません。
        working-directory: upstream/practice-ui-lab/app # 実URLからアプリを起動します。
        env: # ローカル試験と区別します。
          SITE_URL: ${{ needs.deploy.outputs.page_url }} # 公開URLを渡します。
        run: node tools/production-browser.mjs # ゲストの合成練習を保存・コピーします。
      - name: Preserve public-site evidence # 公開後の結果を残します。
        if: always() # 失敗時も証拠を保存します。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 固定した保存処理です。
        with: # 本人データは含みません。
          name: practice-production-live # 事前検証とは別にします。
          path: | # 実URLの結果だけです。
            reports/live-files.json
            upstream/practice-ui-lab/app/reports/production-live/
          retention-days: 14 # 後日確認できる期間です。
